<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — Open Way</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #475569;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.25rem;
        border-radius: 0.5rem;
        border: none;
        background: #0f766e;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Open Way needs an internet connection to load places, reviews, and other content.
        Reconnect and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
